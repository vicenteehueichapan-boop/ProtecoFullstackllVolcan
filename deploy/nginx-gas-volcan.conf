server {
    # Demostración por túnel SSH: no publica credenciales mediante HTTP en Internet.
    listen 127.0.0.1:8080;
    server_name _;

    root /var/www/gas-volcan-ep3;
    index index.html;

    # API en el mismo origen del navegador. Node escucha solo en loopback.
    location /api/v1/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
